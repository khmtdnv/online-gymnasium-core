[project]
name = "schedule-service"
version = "0.1.0"
description = "OG1 schedule service"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi (>=0.141.1,<0.142.0)", "uvicorn[standard] (>=0.52.4,<0.53.0)"]

[tool.poetry]
packages = [
    { include = "schedule_service", from = "src" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "ruff (>=0.16.5,<0.17.0)"
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]
