[project]
name = "document-service"
version = "0.1.0"
description = "OG1 document generation service"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic (>=1.19.2,<2.0.0)",
    "celery[amqp] (>=5.6.3,<6.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "minio (>=7.2.20,<8.0.0)",
    "psycopg[binary] (>=3.3.2,<4.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "uvicorn[standard] (>=0.52.4,<0.53.0)",
    "weasyprint (>=67.0,<68.0)",
]

[tool.poetry]
packages = [
    { include = "document_service", from = "src" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "httpx (>=0.28.0,<1.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.5,<0.17.0)",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]
