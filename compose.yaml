services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  redis:
    image: redis:8.10.1-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  postgres:
    image: postgres:18
    env_file:
      - ./services/schedule/.postgres.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  migrations:
    build:
      context: ./services/schedule
    env_file:
      - ./services/schedule/.env
      - ./services/schedule/.postgres.env
    command:
      - /bin/sh
      - -c
      - >
        DATABASE_URL="postgresql+asyncpg://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB}"
        poetry run alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  outbox-relay:
    build:
      context: ./services/schedule
    env_file:
      - ./services/schedule/.env
      - ./services/schedule/.postgres.env
    command:
      - /bin/sh
      - -c
      - >
        DATABASE_URL="postgresql+asyncpg://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB}"
        KAFKA_BOOTSTRAP_SERVERS="kafka:19092"
        exec poetry run python -m schedule_service.workers.outbox_relay
    depends_on:
      migrations:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  cache-invalidator:
    build:
      context: ./services/schedule
    env_file:
      - ./services/schedule/.env
    command:
      - /bin/sh
      - -c
      - >
        KAFKA_BOOTSTRAP_SERVERS="kafka:19092"
        REDIS_URL="redis://redis:6379/0"
        exec poetry run python -m schedule_service.workers.cache_invalidator
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  schedule-api:
    build:
      context: ./services/schedule
    env_file:
      - ./services/schedule/.env
      - ./services/schedule/.postgres.env
    command:
      - /bin/sh
      - -c
      - >
        DATABASE_URL="postgresql+asyncpg://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB}"
        REDIS_URL="redis://redis:6379/0"
        exec poetry run uvicorn schedule_service.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/live')",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  clickhouse:
    env_file:
      - ./services/analytics/.clickhouse.env
    image: clickhouse/clickhouse-server:26.8
    ports:
      - "8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  analytics-worker:
    build:
      context: ./services/analytics
    env_file:
      - ./services/analytics/.clickhouse.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
    command:
      - poetry
      - run
      - python
      - -m
      - analytics_service.workers.worker
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  analytics-api:
    build:
      context: ./services/analytics
    env_file:
      - ./services/analytics/.clickhouse.env
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
    command:
      - poetry
      - run
      - uvicorn
      - analytics_service.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8001:8000"
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/live')",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  clickhouse_data: